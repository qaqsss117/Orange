name: package

on:
  workflow_dispatch:
    inputs:
      upload_ios:
        description: Upload the signed iOS package to App Store Connect
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  COREPACK_NPM_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  RUSTUP_DIST_SERVER: https://static.rust-lang.org
  RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup
  CARGO_REGISTRIES_CRATES_IO_INDEX: sparse+https://index.crates.io/
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  GOPROXY: https://proxy.golang.org
  GOSUMDB: sum.golang.org

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            desktop: true
            artifact_path: |
              target/release/bundle/nsis/*.exe
          - platform: linux
            runner: ubuntu-latest
            desktop: true
            artifact_path: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
          - platform: macos
            runner: macos-latest
            desktop: true
            artifact_path: |
              target/release/bundle/pkg/*.pkg
              target/release/bundle/pkg/*.pkg.sig
          - platform: android
            runner: ubuntu-latest
            desktop: false
            artifact_path: |
              src-tauri/gen/android/app/build/outputs/apk/**/*.apk
              src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
              artifacts/android/android-update-manifest.json
              artifacts/android/android-update.txt
              artifacts/bootstrap/release/bootstrap.enc
              artifacts/bootstrap/release/bootstrap.remote.manifest.*.json
              artifacts/bootstrap/release/bootstrap.txt
          - platform: ios
            runner: macos-latest
            desktop: false
            artifact_path: |
              src-tauri/gen/apple/build/**/*.ipa
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@v7
        if: matrix.desktop || matrix.platform == 'android'
        with:
          go-version: "1.25.5"
          cache: true
          cache-dependency-path: |
            native/controlplane/go.sum
            native/dataplane/go.sum
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        if: matrix.platform == 'android'
      - name: Install Android SDK components
        if: matrix.platform == 'android'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Check platform toolchains
        run: python scripts/ci/check_toolchains.py ${{ matrix.platform }}
      - name: Remove unused Homebrew tap
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          if brew tap | grep -Fqx 'aws/tap'; then
            brew untap --force aws/tap
          fi
      - name: Install Linux package dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev rpm wget
      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ matrix.platform }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ matrix.platform }}-
      - name: Restore Gradle cache
        if: matrix.platform == 'android'
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: gradle-android-${{ hashFiles('Cargo.lock', 'pnpm-lock.yaml', 'toolchains.toml') }}
          restore-keys: gradle-android-
      - run: pnpm install --frozen-lockfile
      - name: Import Windows signing certificate
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "orange-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $importedCertificates = @(Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password)
          $certificate = $importedCertificates |
            Where-Object {
              $_.HasPrivateKey -and
              ($_.EnhancedKeyUsageList.ObjectId -contains "1.3.6.1.5.5.7.3.3")
            } |
            Select-Object -First 1
          if ($null -eq $certificate) {
            throw "WINDOWS_CERTIFICATE must contain a private key with the Code Signing EKU"
          }

          $thumbprint = ($certificate.Thumbprint -replace '\s', '').ToUpperInvariant()
          if ($thumbprint -notmatch '^[0-9A-F]{40}$') {
            throw "Imported Windows signing certificate has an invalid SHA-1 thumbprint"
          }
          "ORANGE_WINDOWS_SIGNER_SHA1=$thumbprint" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append
      - name: Configure Apple API authentication
        if: matrix.platform == 'macos' || matrix.platform == 'ios'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          : "${APPLE_API_KEY:?APPLE_API_KEY repository variable is required}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER repository variable is required}"
          : "${APPLE_API_PRIVATE_KEY:?APPLE_API_PRIVATE_KEY repository secret is required}"
          private_key_directory="$HOME/.appstoreconnect/private_keys"
          private_key_path="$private_key_directory/AuthKey_${APPLE_API_KEY}.p8"
          mkdir -p "$private_key_directory"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$private_key_path"
          chmod 600 "$private_key_path"
          echo "APPLE_API_KEY_PATH=$private_key_path" >> "$GITHUB_ENV"
      - name: Configure Apple build metadata
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          apple_bundle_id="$(node -e 'const fs = require("node:fs"); const config = JSON.parse(fs.readFileSync("src-tauri/tauri.ios.conf.json", "utf8")); process.stdout.write(config.identifier)')"
          : "${apple_bundle_id:?iOS bundle identifier is required}"
          build_sequence=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          build_major=$((build_sequence / 10000))
          build_minor=$(((build_sequence / 100) % 100))
          build_patch=$((build_sequence % 100))
          echo "APPLE_BUNDLE_ID=$apple_bundle_id" >> "$GITHUB_ENV"
          echo "APPLE_BUILD_VERSION=${build_major}.${build_minor}.${build_patch}" >> "$GITHUB_ENV"
      - name: Configure Developer ID signing
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_APP_CERTIFICATE: ${{ secrets.MACOS_APP_CERTIFICATE }}
          MACOS_APP_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          : "${MACOS_APP_CERTIFICATE:?MACOS_APP_CERTIFICATE repository secret is required}"
          : "${MACOS_APP_CERTIFICATE_PASSWORD:?MACOS_APP_CERTIFICATE_PASSWORD repository secret is required}"
          : "${MACOS_INSTALLER_CERTIFICATE:?MACOS_INSTALLER_CERTIFICATE repository secret is required}"
          : "${MACOS_INSTALLER_CERTIFICATE_PASSWORD:?MACOS_INSTALLER_CERTIFICATE_PASSWORD repository secret is required}"
          app_certificate_path="$RUNNER_TEMP/orange-macos-app.p12"
          installer_certificate_path="$RUNNER_TEMP/orange-macos-installer.p12"
          keychain_path="$RUNNER_TEMP/orange-macos-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          python3 -c 'import base64, os, pathlib, sys; pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ[sys.argv[2]], validate=True))' "$app_certificate_path" MACOS_APP_CERTIFICATE
          python3 -c 'import base64, os, pathlib, sys; pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ[sys.argv[2]], validate=True))' "$installer_certificate_path" MACOS_INSTALLER_CERTIFICATE
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$app_certificate_path" -k "$keychain_path" -P "$MACOS_APP_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import "$installer_certificate_path" -k "$keychain_path" -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          app_signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              awk -F '"' '/Developer ID Application:/ { print $2; exit }'
          )"
          installer_signing_identity="$(
            security find-identity -v "$keychain_path" |
              awk -F '"' '/Developer ID Installer:/ { print $2; exit }'
          )"
          development_team="$(
            printf '%s\n' "$app_signing_identity" |
              sed -nE 's/.*\(([A-Z0-9]{10})\)$/\1/p'
          )"
          installer_team="$(
            printf '%s\n' "$installer_signing_identity" |
              sed -nE 's/.*\(([A-Z0-9]{10})\)$/\1/p'
          )"
          : "${app_signing_identity:?Developer ID Application identity is missing from MACOS_APP_CERTIFICATE}"
          : "${installer_signing_identity:?Developer ID Installer identity is missing from MACOS_INSTALLER_CERTIFICATE}"
          : "${development_team:?Could not derive the Apple development team from MACOS_APP_CERTIFICATE}"
          if [[ "$installer_team" != "$development_team" ]]; then
            echo "Developer ID Application and Installer certificates use different teams" >&2
            exit 1
          fi

          echo "APPLE_DEVELOPMENT_TEAM=$development_team" >> "$GITHUB_ENV"
          echo "MACOS_APP_SIGNING_IDENTITY=$app_signing_identity" >> "$GITHUB_ENV"
          echo "MACOS_INSTALLER_SIGNING_IDENTITY=$installer_signing_identity" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
      - name: Build production bootstrap
        if: matrix.desktop || matrix.platform == 'android'
        env:
          ORANGE_BOOTSTRAP_BUILD_KEY_HEX: ${{ secrets.ORANGE_BOOTSTRAP_BUILD_KEY_HEX }}
          ORANGE_BOOTSTRAP_CONFIG_JSON: ${{ secrets.ORANGE_BOOTSTRAP_CONFIG_JSON }}
          ORANGE_BOOTSTRAP_CHANNEL: ${{ vars.ORANGE_BOOTSTRAP_CHANNEL }}
          ORANGE_BOOTSTRAP_PRODUCT_VERSION: ${{ vars.ORANGE_BOOTSTRAP_PRODUCT_VERSION }}
          ORANGE_BOOTSTRAP_KEY_ID: ${{ vars.ORANGE_BOOTSTRAP_KEY_ID }}
          ORANGE_BOOTSTRAP_SIGNING_KEY_HEX: ${{ secrets.ORANGE_BOOTSTRAP_SIGNING_KEY_HEX }}
          ORANGE_BOOTSTRAP_SIGNING_KEY_ID: ${{ vars.ORANGE_BOOTSTRAP_SIGNING_KEY_ID }}
          ORANGE_BOOTSTRAP_ENVELOPE_URLS: ${{ vars.ORANGE_BOOTSTRAP_ENVELOPE_URLS }}
          ORANGE_BOOTSTRAP_MINIMUM_CLIENT_VERSION: ${{ vars.ORANGE_BOOTSTRAP_MINIMUM_CLIENT_VERSION }}
          ORANGE_BOOTSTRAP_MANIFEST_URLS: ${{ vars.ORANGE_BOOTSTRAP_MANIFEST_URLS }}
          ORANGE_BOOTSTRAP_TXT_NAMES: ${{ vars.ORANGE_BOOTSTRAP_TXT_NAMES }}
          ORANGE_BOOTSTRAP_TXT_MANIFEST_URLS: ${{ vars.ORANGE_BOOTSTRAP_TXT_MANIFEST_URLS }}
          ORANGE_BOOTSTRAP_TXT_ENVELOPE_URLS: ${{ vars.ORANGE_BOOTSTRAP_TXT_ENVELOPE_URLS }}
          ORANGE_BOOTSTRAP_SIGNING_PUBLIC_KEYS: ${{ vars.ORANGE_BOOTSTRAP_SIGNING_PUBLIC_KEYS }}
          ORANGE_BOOTSTRAP_TXT_SEQUENCE: ${{ vars.ORANGE_BOOTSTRAP_TXT_SEQUENCE }}
          ORANGE_BOOTSTRAP_TXT_EXPIRES_AT_UNIX: ${{ vars.ORANGE_BOOTSTRAP_TXT_EXPIRES_AT_UNIX }}
        run: python scripts/ci/build_bootstrap_resource.py
      - name: Build Windows package
        if: matrix.platform == 'windows'
        env:
          ORANGE_BOOTSTRAP_BUILD_KEY_HEX: ${{ secrets.ORANGE_BOOTSTRAP_BUILD_KEY_HEX }}
          ORANGE_BOOTSTRAP_MANIFEST_URLS: ${{ vars.ORANGE_BOOTSTRAP_MANIFEST_URLS }}
          ORANGE_BOOTSTRAP_TXT_NAMES: ${{ vars.ORANGE_BOOTSTRAP_TXT_NAMES }}
          ORANGE_BOOTSTRAP_SIGNING_PUBLIC_KEYS: ${{ vars.ORANGE_BOOTSTRAP_SIGNING_PUBLIC_KEYS }}
          ORANGE_WINDOWS_STORE_PRODUCT_ID: ${{ vars.ORANGE_WINDOWS_STORE_PRODUCT_ID }}
          ORANGE_WINDOWS_STORE_BUILD: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Sidecars are already signed by prepare_windows_bundle.py, and
          # orange-data-plane.exe is pinned by SHA-256 in the runtime manifest
          # embedded in orange-service. The bundler would otherwise re-sign
          # them (its signtool verify /pa rejects the untrusted dev cert),
          # changing the bytes and breaking the hash pin.
          TAURI_SKIP_SIDECAR_SIGNATURE_CHECK: "true"
        shell: pwsh
        run: |
          if ($env:ORANGE_WINDOWS_SIGNER_SHA1 -notmatch '^[0-9A-Fa-f]{40}$') {
            throw "ORANGE_WINDOWS_SIGNER_SHA1 must be a 40-character SHA-1 thumbprint"
          }
          if ($env:ORANGE_BOOTSTRAP_BUILD_KEY_HEX -notmatch '^[0-9A-Fa-f]{64}$') {
            throw "ORANGE_BOOTSTRAP_BUILD_KEY_HEX must be a 64-character hexadecimal secret"
          }

          $signing = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $env:ORANGE_WINDOWS_SIGNER_SHA1
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Compress -Depth 4
          $configPath = Join-Path $env:RUNNER_TEMP "orange-windows-signing.json"
          [IO.File]::WriteAllText(
            $configPath,
            $signing,
            [Text.UTF8Encoding]::new($false)
          )
          pnpm tauri build --bundles nsis --ci --config $configPath
      - name: Verify embedded bootstrap resource
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $appBinary = Get-Item "target/release/orange-app.exe"
          $binaryText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($appBinary.FullName))
          if (-not $binaryText.Contains("ORNGBTP1")) {
            throw "Embedded production bootstrap is missing from $($appBinary.Name); check the ORANGE_BOOTSTRAP_* secrets"
          }
      - name: Verify bundled data-plane hash matches runtime manifest
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $manifest = Get-Content "native/windows/data-plane-runtime-manifest.json" | ConvertFrom-Json
          $bundled = Get-Item "target/release/orange-data-plane.exe"
          $bundledHash = (Get-FileHash $bundled -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bundledHash -ne $manifest.artifact.sha256) {
            throw "Bundled $($bundled.Name) hash $bundledHash diverged from runtime manifest $($manifest.artifact.sha256); the signing pipeline re-signed a pinned artifact"
          }
      - name: Build Linux package
        if: matrix.platform == 'linux'
        env:
          ORANGE_BOOTSTRAP_BUILD_KEY_HEX: ${{ secrets.ORANGE_BOOTSTRAP_BUILD_KEY_HEX }}
          ORANGE_BOOTSTRAP_MANIFEST_URLS: ${{ vars.ORANGE_BOOTSTRAP_MANIFEST_URLS }}
          ORANGE_BOOTSTRAP_TXT_NAMES: ${{ vars.ORANGE_BOOTSTRAP_TXT_NAMES }}
          ORANGE_BOOTSTRAP_SIGNING_PUBLIC_KEYS: ${{ vars.ORANGE_BOOTSTRAP_SIGNING_PUBLIC_KEYS }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --ci
      - name: Build macOS package
        if: matrix.platform == 'macos'
        env:
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          ORANGE_BOOTSTRAP_BUILD_KEY_HEX: ${{ secrets.ORANGE_BOOTSTRAP_BUILD_KEY_HEX }}
          ORANGE_BOOTSTRAP_MANIFEST_URLS: ${{ vars.ORANGE_BOOTSTRAP_MANIFEST_URLS }}
          ORANGE_BOOTSTRAP_TXT_NAMES: ${{ vars.ORANGE_BOOTSTRAP_TXT_NAMES }}
          ORANGE_BOOTSTRAP_SIGNING_PUBLIC_KEYS: ${{ vars.ORANGE_BOOTSTRAP_SIGNING_PUBLIC_KEYS }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: bash scripts/ci/build_macos_package.sh
      - name: Initialize Android project
        if: matrix.platform == 'android'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORANGE_ANDROID_PACKAGE_ID: ${{ vars.ORANGE_ANDROID_PACKAGE_ID }}
        run: |
          : "${ORANGE_ANDROID_PACKAGE_ID:?ORANGE_ANDROID_PACKAGE_ID is required}"
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260820023541-8e8303b9da6c
          python scripts/ci/build_android_control_plane.py
          android_config="$(node -e 'process.stdout.write(JSON.stringify({ identifier: process.argv[1] }))' "$ORANGE_ANDROID_PACKAGE_ID")"
          pnpm tauri android init --ci --config "$android_config"
          python scripts/dev/configure-generated-android.py
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orange.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/orange.jks
          password=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build Android package
        if: matrix.platform == 'android'
        env:
          ORANGE_BOOTSTRAP_BUILD_KEY_HEX: ${{ secrets.ORANGE_BOOTSTRAP_BUILD_KEY_HEX }}
          ORANGE_BOOTSTRAP_MANIFEST_URLS: ${{ vars.ORANGE_BOOTSTRAP_MANIFEST_URLS }}
          ORANGE_BOOTSTRAP_TXT_NAMES: ${{ vars.ORANGE_BOOTSTRAP_TXT_NAMES }}
          ORANGE_BOOTSTRAP_SIGNING_PUBLIC_KEYS: ${{ vars.ORANGE_BOOTSTRAP_SIGNING_PUBLIC_KEYS }}
          ORANGE_ANDROID_UPDATE_MANIFEST_URLS: ${{ vars.ORANGE_ANDROID_UPDATE_MANIFEST_URLS }}
          ORANGE_ANDROID_UPDATE_TXT_NAMES: ${{ vars.ORANGE_ANDROID_UPDATE_TXT_NAMES }}
          ORANGE_ANDROID_PACKAGE_ID: ${{ vars.ORANGE_ANDROID_PACKAGE_ID }}
          ORANGE_ANDROID_VERSION_CODE: ${{ vars.ORANGE_ANDROID_VERSION_CODE }}
          ORANGE_ANDROID_SIGNING_CERT_SHA256: ${{ vars.ORANGE_ANDROID_SIGNING_CERT_SHA256 }}
        run: pnpm tauri android build --apk --aab --ci
      - name: Generate signed Android update manifest
        if: matrix.platform == 'android'
        env:
          ORANGE_ANDROID_PACKAGE_ID: ${{ vars.ORANGE_ANDROID_PACKAGE_ID }}
          ORANGE_ANDROID_VERSION_CODE: ${{ vars.ORANGE_ANDROID_VERSION_CODE }}
          ORANGE_ANDROID_VERSION_NAME: ${{ vars.ORANGE_ANDROID_VERSION_NAME }}
          ORANGE_ANDROID_SIGNING_CERT_SHA256: ${{ vars.ORANGE_ANDROID_SIGNING_CERT_SHA256 }}
          ORANGE_ANDROID_APK_MIRROR_URLS: ${{ vars.ORANGE_ANDROID_APK_MIRROR_URLS }}
          ORANGE_ANDROID_UPDATE_MANIFEST_URLS: ${{ vars.ORANGE_ANDROID_UPDATE_MANIFEST_URLS }}
          ORANGE_ANDROID_UPDATE_TXT_MANIFEST_URLS: ${{ vars.ORANGE_ANDROID_UPDATE_TXT_MANIFEST_URLS }}
          ORANGE_ANDROID_UPDATE_EXPIRES_AT_UNIX: ${{ vars.ORANGE_ANDROID_UPDATE_EXPIRES_AT_UNIX }}
          ORANGE_ANDROID_UPDATE_TXT_SEQUENCE: ${{ vars.ORANGE_ANDROID_UPDATE_TXT_SEQUENCE }}
          ORANGE_BOOTSTRAP_SIGNING_KEY_HEX: ${{ secrets.ORANGE_BOOTSTRAP_SIGNING_KEY_HEX }}
          ORANGE_BOOTSTRAP_SIGNING_KEY_ID: ${{ vars.ORANGE_BOOTSTRAP_SIGNING_KEY_ID }}
          ORANGE_BOOTSTRAP_SIGNING_PUBLIC_KEYS: ${{ vars.ORANGE_BOOTSTRAP_SIGNING_PUBLIC_KEYS }}
        run: python scripts/ci/build_android_update_manifest.py
      - name: Verify Android embedded bootstrap
        if: matrix.platform == 'android'
        shell: bash
        run: |
          apk_path="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -path '*release*' -print -quit)"
          test -n "$apk_path"
          python scripts/ci/verify_android_embedded_bootstrap.py "$apk_path"
      - name: Build iOS package
        if: matrix.platform == 'ios'
        shell: bash
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
        run: |
          pnpm tauri ios init --ci
          ios_config="$(node -e 'process.stdout.write(JSON.stringify({ identifier: process.argv[1], bundle: { iOS: { bundleVersion: process.argv[2] } } }))' "$APPLE_BUNDLE_ID" "$APPLE_BUILD_VERSION")"
          pnpm tauri ios build \
            --ci \
            --config "$ios_config" \
            --export-method app-store-connect
      - uses: actions/upload-artifact@v7
        with:
          name: orange-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
      - name: Upload iOS package to App Store Connect
        if: matrix.platform == 'ios' && (startsWith(github.ref, 'refs/tags/v') || inputs.upload_ios == true)
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
        run: |
          ipa_path="$(find src-tauri/gen/apple/build -type f -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa_path" \
            --apiKey "$APPLE_API_KEY" \
            --apiIssuer "$APPLE_API_ISSUER"
      - name: Remove temporary Apple signing material
        if: always() && (matrix.platform == 'macos' || matrix.platform == 'ios')
        shell: bash
        run: |
          if [[ -n "${MACOS_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$MACOS_SIGNING_KEYCHAIN" || true
          fi
          for path in \
            "${APPLE_API_KEY_PATH:-}" \
            "$RUNNER_TEMP/orange-macos-app.p12" \
            "$RUNNER_TEMP/orange-macos-installer.p12"; do
            if [[ -n "$path" ]]; then
              rm -f "$path"
            fi
          done

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: orange-windows
          path: target/release/bundle/nsis
      - uses: actions/download-artifact@v8
        with:
          name: orange-macos
          path: target/release/bundle/pkg
      - name: Generate unified updater manifest
        run: >-
          python scripts/ci/generate_update_manifest.py
          --repo ${{ github.repository }}
          --tag ${{ github.ref_name }}
          --include-macos
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/pkg/*.pkg
            target/release/bundle/pkg/*.pkg.sig
            latest.json
          generate_release_notes: true
