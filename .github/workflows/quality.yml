name: package

on:
  workflow_dispatch:
    inputs:
      upload_macos:
        description: Upload the signed macOS package to App Store Connect
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  COREPACK_NPM_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  RUSTUP_DIST_SERVER: https://static.rust-lang.org
  RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup
  CARGO_REGISTRIES_CRATES_IO_INDEX: sparse+https://index.crates.io/
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  GOPROXY: https://proxy.golang.org
  GOSUMDB: sum.golang.org

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            desktop: true
            artifact_path: target/release/bundle/nsis/*.exe
          - platform: linux
            runner: ubuntu-latest
            desktop: true
            artifact_path: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
          - platform: macos
            runner: macos-latest
            desktop: true
            artifact_path: |
              target/release/bundle/pkg/*.pkg
              target/apple-smoke/macos-shell.txt
          - platform: android
            runner: ubuntu-latest
            desktop: false
            artifact_path: |
              src-tauri/gen/android/app/build/outputs/apk/**/*.apk
              src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          - platform: ios
            runner: macos-latest
            desktop: false
            artifact_path: |
              src-tauri/gen/apple/build/**/*.ipa
              target/apple-smoke/ios-shell.txt
              target/apple-smoke/ios-shell.png
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
      APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      MACOS_APP_CERTIFICATE: ${{ secrets.MACOS_APP_CERTIFICATE }}
      MACOS_APP_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_CERTIFICATE_PASSWORD }}
      MACOS_APP_SIGNING_IDENTITY: ${{ vars.MACOS_APP_SIGNING_IDENTITY }}
      MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
      MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
      MACOS_INSTALLER_SIGNING_IDENTITY: ${{ vars.MACOS_INSTALLER_SIGNING_IDENTITY }}
      MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@v5
        if: matrix.desktop
        with:
          go-version: "1.25.5"
          cache: true
          cache-dependency-path: |
            native/controlplane/go.sum
            native/dataplane/go.sum
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
      - name: Install Android SDK components
        if: matrix.platform == 'android'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Install Linux package dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev rpm wget
      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ matrix.platform }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ matrix.platform }}-
      - name: Restore Gradle cache
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: gradle-android-${{ hashFiles('Cargo.lock', 'pnpm-lock.yaml', 'toolchains.toml') }}
          restore-keys: gradle-android-
      - run: pnpm install --frozen-lockfile
      - name: Import Windows signing certificate
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "orange-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $importedCertificates = @(Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password)
          $certificate = $importedCertificates |
            Where-Object {
              $_.HasPrivateKey -and
              ($_.EnhancedKeyUsageList.ObjectId -contains "1.3.6.1.5.5.7.3.3")
            } |
            Select-Object -First 1
          if ($null -eq $certificate) {
            throw "WINDOWS_CERTIFICATE must contain a private key with the Code Signing EKU"
          }

          $thumbprint = ($certificate.Thumbprint -replace '\s', '').ToUpperInvariant()
          if ($thumbprint -notmatch '^[0-9A-F]{40}$') {
            throw "Imported Windows signing certificate has an invalid SHA-1 thumbprint"
          }
          "ORANGE_WINDOWS_SIGNER_SHA1=$thumbprint" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append
      - name: Configure Apple API authentication
        if: matrix.platform == 'macos' || matrix.platform == 'ios'
        shell: bash
        env:
          APPLE_PLATFORM: ${{ matrix.platform }}
        run: |
          : "${APPLE_API_KEY:?APPLE_API_KEY repository variable is required}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER repository variable is required}"
          : "${APPLE_API_PRIVATE_KEY:?APPLE_API_PRIVATE_KEY repository secret is required}"
          : "${APPLE_DEVELOPMENT_TEAM:?APPLE_DEVELOPMENT_TEAM repository variable is required}"
          apple_config_path="src-tauri/tauri.${APPLE_PLATFORM}.conf.json"
          APPLE_BUNDLE_ID="$(node -e 'const fs = require("node:fs"); const config = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(config.identifier)' "$apple_config_path")"
          : "${APPLE_BUNDLE_ID:?Apple platform identifier is required}"
          private_key_directory="$HOME/.appstoreconnect/private_keys"
          private_key_path="$private_key_directory/AuthKey_${APPLE_API_KEY}.p8"
          mkdir -p "$private_key_directory"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$private_key_path"
          chmod 600 "$private_key_path"
          echo "APPLE_API_KEY_PATH=$private_key_path" >> "$GITHUB_ENV"
          echo "APPLE_BUNDLE_ID=$APPLE_BUNDLE_ID" >> "$GITHUB_ENV"
      - name: Configure Apple build metadata
        if: matrix.platform == 'macos' || matrix.platform == 'ios'
        shell: bash
        run: |
          build_sequence=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          build_major=$((build_sequence / 10000))
          build_minor=$(((build_sequence / 100) % 100))
          build_patch=$((build_sequence % 100))
          echo "APPLE_BUILD_VERSION=${build_major}.${build_minor}.${build_patch}" >> "$GITHUB_ENV"
      - name: Configure Mac App Store signing
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          : "${MACOS_APP_CERTIFICATE:?MACOS_APP_CERTIFICATE repository secret is required}"
          : "${MACOS_APP_CERTIFICATE_PASSWORD:?MACOS_APP_CERTIFICATE_PASSWORD repository secret is required}"
          : "${MACOS_APP_SIGNING_IDENTITY:?MACOS_APP_SIGNING_IDENTITY repository variable is required}"
          : "${MACOS_INSTALLER_CERTIFICATE:?MACOS_INSTALLER_CERTIFICATE repository secret is required}"
          : "${MACOS_INSTALLER_CERTIFICATE_PASSWORD:?MACOS_INSTALLER_CERTIFICATE_PASSWORD repository secret is required}"
          : "${MACOS_INSTALLER_SIGNING_IDENTITY:?MACOS_INSTALLER_SIGNING_IDENTITY repository variable is required}"
          : "${MACOS_PROVISIONING_PROFILE:?MACOS_PROVISIONING_PROFILE repository secret is required}"

          app_certificate_path="$RUNNER_TEMP/orange-macos-app.p12"
          installer_certificate_path="$RUNNER_TEMP/orange-macos-installer.p12"
          provisioning_profile_path="$RUNNER_TEMP/orange-macos.provisionprofile"
          provisioning_plist_path="$RUNNER_TEMP/orange-macos-profile.plist"
          entitlements_path="$RUNNER_TEMP/orange-macos-entitlements.plist"
          keychain_path="$RUNNER_TEMP/orange-macos-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          python3 -c 'import base64, os, pathlib, sys; pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ[sys.argv[2]], validate=True))' "$app_certificate_path" MACOS_APP_CERTIFICATE
          python3 -c 'import base64, os, pathlib, sys; pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ[sys.argv[2]], validate=True))' "$installer_certificate_path" MACOS_INSTALLER_CERTIFICATE
          python3 -c 'import base64, os, pathlib, sys; pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ[sys.argv[2]], validate=True))' "$provisioning_profile_path" MACOS_PROVISIONING_PROFILE

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$app_certificate_path" -k "$keychain_path" -P "$MACOS_APP_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import "$installer_certificate_path" -k "$keychain_path" -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          security find-identity -v -p codesigning "$keychain_path" | grep -Fq "\"$MACOS_APP_SIGNING_IDENTITY\""
          security find-certificate -c "$MACOS_INSTALLER_SIGNING_IDENTITY" "$keychain_path" > /dev/null
          security cms -D -i "$provisioning_profile_path" -o "$provisioning_plist_path"
          plutil -extract Entitlements xml1 -o "$entitlements_path" "$provisioning_plist_path"
          /usr/libexec/PlistBuddy -c 'Delete :com.apple.security.app-sandbox' "$entitlements_path" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :com.apple.security.app-sandbox bool true' "$entitlements_path"

          profile_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$provisioning_plist_path")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.team-identifier' "$provisioning_plist_path")"
          signing_sandbox="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$entitlements_path")"
          [[ "$profile_identifier" == *."$APPLE_BUNDLE_ID" ]]
          [[ "$profile_team" == "$APPLE_DEVELOPMENT_TEAM" ]]
          [[ "$signing_sandbox" == "true" ]]

          echo "MACOS_PROVISIONING_PROFILE_PATH=$provisioning_profile_path" >> "$GITHUB_ENV"
          echo "MACOS_ENTITLEMENTS_PATH=$entitlements_path" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
      - name: Build production bootstrap
        if: matrix.desktop
        env:
          ORANGE_BOOTSTRAP_BUILD_KEY_HEX: ${{ secrets.ORANGE_BOOTSTRAP_BUILD_KEY_HEX }}
          ORANGE_BOOTSTRAP_CONFIG_JSON: ${{ secrets.ORANGE_BOOTSTRAP_CONFIG_JSON }}
          ORANGE_BOOTSTRAP_CHANNEL: ${{ vars.ORANGE_BOOTSTRAP_CHANNEL }}
          ORANGE_BOOTSTRAP_PRODUCT_VERSION: ${{ vars.ORANGE_BOOTSTRAP_PRODUCT_VERSION }}
          ORANGE_BOOTSTRAP_KEY_ID: ${{ vars.ORANGE_BOOTSTRAP_KEY_ID }}
        run: python scripts/ci/build_bootstrap_resource.py
      - name: Build Windows package
        if: matrix.platform == 'windows'
        env:
          ORANGE_BOOTSTRAP_BUILD_KEY_HEX: ${{ secrets.ORANGE_BOOTSTRAP_BUILD_KEY_HEX }}
        shell: pwsh
        run: |
          if ($env:ORANGE_WINDOWS_SIGNER_SHA1 -notmatch '^[0-9A-Fa-f]{40}$') {
            throw "ORANGE_WINDOWS_SIGNER_SHA1 must be a 40-character SHA-1 thumbprint"
          }

          $signing = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $env:ORANGE_WINDOWS_SIGNER_SHA1
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Compress -Depth 4
          $configPath = Join-Path $env:RUNNER_TEMP "orange-windows-signing.json"
          [IO.File]::WriteAllText(
            $configPath,
            $signing,
            [Text.UTF8Encoding]::new($false)
          )
          pnpm tauri build --bundles nsis --ci --config $configPath
      - name: Build Linux package
        if: matrix.platform == 'linux'
        env:
          ORANGE_BOOTSTRAP_BUILD_KEY_HEX: ${{ secrets.ORANGE_BOOTSTRAP_BUILD_KEY_HEX }}
        run: pnpm tauri build --ci
      - name: Build macOS package
        if: matrix.platform == 'macos'
        env:
          ORANGE_BOOTSTRAP_BUILD_KEY_HEX: ${{ secrets.ORANGE_BOOTSTRAP_BUILD_KEY_HEX }}
        shell: bash
        run: |
          macos_config="$(node -e 'process.stdout.write(JSON.stringify({ identifier: process.argv[1], bundle: { macOS: { bundleVersion: process.argv[2] } } }))' "$APPLE_BUNDLE_ID" "$APPLE_BUILD_VERSION")"
          pnpm tauri build --bundles app --no-sign --ci --config "$macos_config"

          app_path="$(find target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          cp "$MACOS_PROVISIONING_PROFILE_PATH" "$app_path/Contents/embedded.provisionprofile"

          child_entitlements="$RUNNER_TEMP/orange-macos-child-entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Clear dict' "$child_entitlements"
          /usr/libexec/PlistBuddy -c 'Add :com.apple.security.app-sandbox bool true' "$child_entitlements"
          /usr/libexec/PlistBuddy -c 'Add :com.apple.security.inherit bool true' "$child_entitlements"

          main_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          while IFS= read -r -d '' executable; do
            if [[ "$(basename "$executable")" != "$main_executable" ]] && file -b "$executable" | grep -q 'Mach-O'; then
              codesign \
                --force \
                --timestamp \
                --options runtime \
                --entitlements "$child_entitlements" \
                --sign "$MACOS_APP_SIGNING_IDENTITY" \
                --keychain "$MACOS_SIGNING_KEYCHAIN" \
                "$executable"
            fi
          done < <(find "$app_path/Contents/MacOS" -type f -print0)

          codesign \
            --force \
            --timestamp \
            --options runtime \
            --entitlements "$MACOS_ENTITLEMENTS_PATH" \
            --sign "$MACOS_APP_SIGNING_IDENTITY" \
            --keychain "$MACOS_SIGNING_KEYCHAIN" \
            "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          package_directory="target/release/bundle/pkg"
          package_path="$package_directory/Orange.pkg"
          mkdir -p "$package_directory"
          productbuild \
            --component "$app_path" /Applications \
            --sign "$MACOS_INSTALLER_SIGNING_IDENTITY" \
            --keychain "$MACOS_SIGNING_KEYCHAIN" \
            "$package_path"
          pkgutil --check-signature "$package_path"
      - name: Upload macOS package to App Store Connect
        if: matrix.platform == 'macos' && (startsWith(github.ref, 'refs/tags/v') || inputs.upload_macos == true)
        shell: bash
        run: |
          package_path="$(find target/release/bundle/pkg -type f -name '*.pkg' -print -quit)"
          test -n "$package_path"
          xcrun altool --upload-app \
            --type macos \
            --file "$package_path" \
            --apiKey "$APPLE_API_KEY" \
            --apiIssuer "$APPLE_API_ISSUER"
      - name: Smoke macOS shell
        if: matrix.platform == 'macos'
        timeout-minutes: 5
        shell: bash
        run: |
          app_path="$(find target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          bash scripts/ci/smoke_apple_shells.sh macos "$app_path"
      - name: Build Android package
        if: matrix.platform == 'android'
        shell: bash
        run: |
          pnpm tauri android init --ci
          python scripts/dev/configure-generated-android.py
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orange.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/orange.jks
          password=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          pnpm tauri android build --apk --aab --ci
      - name: Build iOS package
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          pnpm tauri ios init --ci
          ios_config="$(node -e 'process.stdout.write(JSON.stringify({ identifier: process.argv[1], bundle: { iOS: { bundleVersion: process.argv[2] } } }))' "$APPLE_BUNDLE_ID" "$APPLE_BUILD_VERSION")"
          pnpm tauri ios build \
            --ci \
            --config "$ios_config" \
            --export-method app-store-connect
      - name: Build iOS simulator shell
        if: matrix.platform == 'ios'
        timeout-minutes: 15
        shell: bash
        run: |
          ios_config="$(node -e 'process.stdout.write(JSON.stringify({ identifier: process.argv[1], bundle: { iOS: { bundleVersion: process.argv[2] } } }))' "$APPLE_BUNDLE_ID" "$APPLE_BUILD_VERSION")"
          pnpm tauri ios build \
            --debug \
            --target aarch64-sim \
            --no-sign \
            --ci \
            --config "$ios_config"
      - name: Smoke iOS simulator shell
        if: matrix.platform == 'ios'
        timeout-minutes: 5
        shell: bash
        run: |
          simulator_app="$(find src-tauri/gen/apple/build -type d -name '*.app' ! -path '*.xcarchive/*' -print -quit)"
          bash scripts/ci/smoke_apple_shells.sh ios "$simulator_app" "$APPLE_BUNDLE_ID"
      - name: Upload iOS package to App Store Connect
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          ipa_path="$(find src-tauri/gen/apple/build -type f -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa_path" \
            --apiKey "$APPLE_API_KEY" \
            --apiIssuer "$APPLE_API_ISSUER"
      - uses: actions/upload-artifact@v4
        with:
          name: orange-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
      - name: Remove temporary Apple signing material
        if: always() && (matrix.platform == 'macos' || matrix.platform == 'ios')
        shell: bash
        run: |
          if [[ -n "${MACOS_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$MACOS_SIGNING_KEYCHAIN" || true
          fi
          for path in \
            "${APPLE_API_KEY_PATH:-}" \
            "${MACOS_PROVISIONING_PROFILE_PATH:-}" \
            "${MACOS_ENTITLEMENTS_PATH:-}" \
            "$RUNNER_TEMP/orange-macos-app.p12" \
            "$RUNNER_TEMP/orange-macos-installer.p12" \
            "$RUNNER_TEMP/orange-macos-profile.plist" \
            "$RUNNER_TEMP/orange-macos-child-entitlements.plist"; do
            if [[ -n "$path" ]]; then
              rm -f "$path"
            fi
          done
