name: package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  COREPACK_NPM_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  RUSTUP_DIST_SERVER: https://static.rust-lang.org
  RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup
  CARGO_REGISTRIES_CRATES_IO_INDEX: sparse+https://index.crates.io/
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  GOPROXY: https://proxy.golang.org
  GOSUMDB: sum.golang.org

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            desktop: true
            artifact_path: target/release/bundle/nsis/*.exe
          - platform: linux
            runner: ubuntu-latest
            desktop: true
            artifact_path: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
          - platform: macos
            runner: macos-latest
            desktop: true
            artifact_path: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app
          - platform: android
            runner: ubuntu-latest
            desktop: false
            artifact_path: |
              src-tauri/gen/android/app/build/outputs/apk/**/*.apk
              src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          - platform: ios
            runner: macos-latest
            desktop: false
            artifact_path: src-tauri/gen/apple/build/**/*.ipa
    env:
      ORANGE_BOOTSTRAP_BUILD_KEY_HEX: ${{ secrets.ORANGE_BOOTSTRAP_BUILD_KEY_HEX }}
      ORANGE_BOOTSTRAP_CONFIG_JSON: ${{ secrets.ORANGE_BOOTSTRAP_CONFIG_JSON }}
      ORANGE_BOOTSTRAP_CHANNEL: ${{ vars.ORANGE_BOOTSTRAP_CHANNEL }}
      ORANGE_BOOTSTRAP_PRODUCT_VERSION: ${{ vars.ORANGE_BOOTSTRAP_PRODUCT_VERSION }}
      ORANGE_BOOTSTRAP_KEY_ID: ${{ vars.ORANGE_BOOTSTRAP_KEY_ID }}
      ORANGE_WINDOWS_SIGNER_SHA1: ${{ vars.ORANGE_WINDOWS_SIGNER_SHA1 }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@v5
        if: matrix.desktop
        with:
          go-version: "1.25.5"
          cache: true
          cache-dependency-path: |
            native/controlplane/go.sum
            native/dataplane/go.sum
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
      - name: Install Android SDK components
        if: matrix.platform == 'android'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Install Linux package dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev rpm wget
      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ matrix.platform }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ matrix.platform }}-
      - name: Restore Gradle cache
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: gradle-android-${{ hashFiles('Cargo.lock', 'pnpm-lock.yaml', 'toolchains.toml') }}
          restore-keys: gradle-android-
      - run: pnpm install --frozen-lockfile
      - name: Import Windows signing certificate
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "orange-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password | Out-Null
      - name: Build production bootstrap
        if: matrix.desktop
        run: python scripts/ci/build_bootstrap_resource.py
      - name: Build Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $signing = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $env:ORANGE_WINDOWS_SIGNER_SHA1
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Compress -Depth 4
          pnpm tauri build --bundles nsis --ci --config $signing
      - name: Build Linux package
        if: matrix.platform == 'linux'
        run: pnpm tauri build --ci
      - name: Build macOS package
        if: matrix.platform == 'macos'
        run: pnpm tauri build --ci
      - name: Build Android package
        if: matrix.platform == 'android'
        shell: bash
        run: |
          pnpm tauri android init --ci
          python scripts/dev/configure-generated-android.py
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orange.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/orange.jks
          password=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          pnpm tauri android build --apk --aab --ci
      - name: Build iOS package
        if: matrix.platform == 'ios'
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          pnpm tauri ios init --ci
          APPLE_API_KEY_PATH="$api_key_path" pnpm tauri ios build --ci --method app-store-connect
      - uses: actions/upload-artifact@v4
        with:
          name: orange-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
