name: security-gates

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

env:
  ORANGE_CI_SOURCE_PROFILE: official
  COREPACK_NPM_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  RUSTUP_DIST_SERVER: https://static.rust-lang.org
  RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup
  CARGO_REGISTRIES_CRATES_IO_INDEX: sparse+https://index.crates.io/
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  GOPROXY: https://proxy.golang.org
  GOSUMDB: sum.golang.org

jobs:
  source-isolation:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Run provider-neutral security gates
        run: python scripts/ci/run.py security
      - name: Check managed resource manifest
        run: python scripts/security/check_resources_manifest.py
      - name: Check dependency locks and denylist
        run: python scripts/security/check_supply_chain.py --report artifacts/security/supply-chain.json
      - uses: actions/upload-artifact@v4
        with:
          name: orange-security-${{ runner.os }}
          path: |
            artifacts/security/source-isolation.json
            artifacts/security/platform-permissions.json
            artifacts/security/control-egress.json
            artifacts/security/supply-chain.json
