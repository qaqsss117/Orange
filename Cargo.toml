[workspace]
resolver = "2"
members = [
    "crates/orange-bootstrap",
    "crates/orange-control-plane-host",
    "crates/orange-domain",
    "crates/orange-ios-secret-store",
    "crates/orange-platform",
    "crates/orange-windows-service",
    "src-tauri",
    "tools/bootstrap-crypto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
rust-version = "1.95.0"

[workspace.dependencies]
base64 = "=0.22.1"
chacha20poly1305 = "=0.10.1"
getrandom = "=0.3.4"
keyring = { version = "=4.1.5", default-features = false, features = ["v1"] }
percent-encoding = "=2.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_path_to_error = "=0.1.20"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", default-features = false, features = ["wry"] }
tauri-build = { version = "=2.6.3", default-features = false }
tauri-plugin = { version = "=2.6.2", default-features = false, features = ["build"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "=2.5.4"
url = "=2.5.8"
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Networking_WinInet",
    "Win32_System_Com",
] }
windows-registry = "=0.6.1"
zeroize = { version = "=1.8.2", features = ["derive", "serde"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
