[workspace]
resolver = "2"
members = [
    "crates/orange-bootstrap",
    "crates/orange-control-plane-host",
    "crates/orange-domain",
    "crates/orange-ios-secret-store",
    "crates/orange-platform",
    "src-tauri",
    "tools/bootstrap-crypto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
rust-version = "1.95.0"

[workspace.dependencies]
base64 = "=0.22.1"
chacha20poly1305 = "=0.10.1"
getrandom = "=0.3.4"
keyring = { version = "=4.1.5", default-features = false, features = ["v1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", default-features = false, features = ["wry"] }
tauri-build = { version = "=2.6.3", default-features = false }
tauri-plugin = { version = "=2.6.2", default-features = false, features = ["build"] }
zeroize = { version = "=1.8.2", features = ["derive", "serde"] }
