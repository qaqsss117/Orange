{
  "schema_version": 1,
  "environment": "development",
  "release_allowed": false,
  "production_hosts_configured": false,
  "hosts": ["api.orange.invalid"],
  "transport": {
    "scheme": "https",
    "port": 443,
    "redirect_policy": "deny",
    "connect_timeout_ms": 5000,
    "request_timeout_ms": 15000,
    "max_concurrent": 16,
    "max_request_bytes": 1048576,
    "max_response_bytes": 1048576,
    "max_request_attempts": 1
  },
  "dynamic_config_url_policy": {
    "scheme": "https",
    "port": 443,
    "allow_credentials": false,
    "allow_query": false,
    "allow_fragment": false,
    "api_hosts": ["api.orange.invalid"],
    "payment_hosts": ["pay.orange.invalid"],
    "support_hosts": ["support.orange.invalid"],
    "banner_hosts": ["assets.orange.invalid"]
  },
  "commands": [
    {
      "name": "login",
      "method": "POST",
      "path": "/api/v1/passport/auth/login",
      "authentication": "none",
      "content_type": "application/json"
    },
    {
      "name": "register",
      "method": "POST",
      "path": "/v1/development/auth/register",
      "authentication": "none",
      "content_type": "application/json"
    },
    {
      "name": "config",
      "method": "GET",
      "path": "/api/v1/guest/comm/config",
      "authentication": "none",
      "content_type": null
    },
    {
      "name": "subscription",
      "method": "GET",
      "path": "/api/v1/user/getSubscribe",
      "authentication": "rust_token",
      "content_type": null
    },
    {
      "name": "account",
      "method": "GET",
      "path": "/api/v1/user/info",
      "authentication": "rust_token",
      "content_type": null
    },
    {
      "name": "plans",
      "method": "GET",
      "path": "/v1/development/plans",
      "authentication": "none",
      "content_type": null
    },
    {
      "name": "orders",
      "method": "POST",
      "path": "/v1/development/orders",
      "authentication": "rust_token",
      "content_type": "application/json"
    },
    {
      "name": "invite",
      "method": "GET",
      "path": "/v1/development/invite",
      "authentication": "rust_token",
      "content_type": null
    },
    {
      "name": "tickets",
      "method": "POST",
      "path": "/v1/development/tickets",
      "authentication": "rust_token",
      "content_type": "application/json"
    },
    {
      "name": "update",
      "method": "GET",
      "path": "/v1/development/update",
      "authentication": "none",
      "content_type": null
    }
  ],
  "frontend_forbidden_request_fields": [
    "authorization",
    "bootstrap",
    "filePath",
    "host",
    "route",
    "token",
    "url"
  ]
}
