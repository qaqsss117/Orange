[package]
name = "orange-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Orange cross-platform application shell"
publish = false

[lib]
name = "orange_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
orange-bootstrap = { path = "../crates/orange-bootstrap" }
orange-domain = { path = "../crates/orange-domain" }
serde_json.workspace = true
sha2.workspace = true
tauri-build.workspace = true
zeroize.workspace = true

[dependencies]
orange-bootstrap = { path = "../crates/orange-bootstrap" }
orange-domain = { path = "../crates/orange-domain" }
orange-platform = { path = "../crates/orange-platform" }
serde_json.workspace = true
tauri.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
orange-ios-secret-store = { path = "../crates/orange-ios-secret-store" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
orange-control-plane-host = { path = "../crates/orange-control-plane-host" }
tauri-plugin-autostart.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-process.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
orange-windows-service = { path = "../crates/orange-windows-service" }
tauri = { workspace = true, features = ["tray-icon"] }
zeroize.workspace = true
